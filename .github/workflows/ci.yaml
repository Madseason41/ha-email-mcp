---
name: CI

# Lint and test only. This workflow does not build for a registry and does not
# push container images.

# yamllint disable-line rule:truthy
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: yamllint
        uses: frenck/action-yamllint@v1.5.0

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: email_mcp/Dockerfile

      - name: Community add-on linter
        uses: frenck/action-addon-linter@v2.21.1
        with:
          path: ./email_mcp

  pytest:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run pytest
        run: pytest -q tests/addon tests/integration

  e2e:
    name: Docker end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-e2e.txt

      - name: Install test dependencies
        run: pip install -r requirements-e2e.txt

      - name: Build locally and test against GreenMail
        run: bash tests/e2e/run_e2e.sh
